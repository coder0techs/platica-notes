name: CI

# Runs the checks that used to be pasted into a merge request by hand, plus the
# invariants the pull-request template used to ask a human to tick off. A red run
# is the same signal as a red local run, so a pull request is not reviewable
# until this is green.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Injection sinks, egress shapes, and one version across every file that
      # carries one. See scripts/check-invariants.mjs for what is deliberately
      # not machine-checkable.
      - run: npm run check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # The bundle is the shipped artifact, so prove it was actually produced
      # rather than trusting a zero exit code.
      - name: Check dist/ was produced
        run: |
          test -f dist/manifest.json
          test -f dist/background.js
          test -f dist/content-meet.js
          test -f dist/meet-rtc-main.js
          ls -la dist

      # A loadable build of every branch, without anyone having to clone and
      # build it. docs/TEAM-INSTALL.md points here.
      - run: node scripts/package.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: platica-notes-${{ github.sha }}
          path: platica-notes-*.zip
          if-no-files-found: error
          retention-days: 30
